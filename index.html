<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#526bc2"><title>나의 업무 · To Do</title><link rel="stylesheet" href="styles.css"><script defer src="core.js"></script><script defer src="app.js"></script><script defer src="cloud.js"></script></head><body>
<section id="auth-screen" class="auth-screen"><form id="login-form" class="auth-card"><div class="avatar">✓</div><h1>나의 업무</h1><p>개인용 할 일 · 로그인하여 이어서 사용하세요</p><label>이메일<input id="login-email" type="email" autocomplete="username" required></label><label>비밀번호<input id="login-password" type="password" autocomplete="current-password" required></label><button class="primary" type="submit">로그인</button><p id="auth-error" role="alert"></p><small>등록된 본인 계정만 사용할 수 있습니다.</small></form></section>
<section id="sync-error" class="auth-screen" hidden><div class="auth-card"><h2>저장 확인이 필요합니다</h2><p id="sync-message" role="alert"></p><button id="sync-backup">현재 내용 백업</button><button id="sync-retry">다시 시도</button><button id="sync-reload">서버 내용 다시 불러오기</button></div></section>
<div class="app" hidden>
<aside class="sidebar" id="sidebar"><div class="identity"><div class="avatar">✓</div><div><strong>나의 업무</strong><small>하나씩, 차근차근</small></div><button class="icon mobile" id="hide-nav" aria-label="메뉴 닫기">×</button></div>
<label class="search"><span>⌕</span><input id="search" placeholder="검색" aria-label="할 일 검색"><kbd>Ctrl K</kbd></label><nav id="nav" aria-label="작업 목록"></nav><div class="new-list"><button id="add-list">＋ 새 목록</button><button class="icon" id="add-group" aria-label="새 그룹" title="새 그룹">▧</button></div>
<footer><button id="logout">로그아웃</button><button id="settings">⚙ 설정 및 백업</button><div class="storage"><span class="dot"></span><span id="save-status" role="status">이 브라우저에 저장됨</span></div></footer></aside>
<main id="main" class="main blue"><header><div><button id="show-nav" class="icon mobile" aria-label="메뉴 열기">☰</button><h1 id="view-title"></h1><p id="date-label"></p></div><div class="toolbar"><button id="suggest" title="오늘 할 일 추천">☼ 추천</button><label class="sort-label"><span>정렬</span><select id="sort" aria-label="작업 정렬"><option value="manual">사용자 순서</option><option value="due">기한순</option><option value="important">중요도순</option><option value="created">최신순</option><option value="title">이름순</option></select></label><button id="list-settings" class="icon" aria-label="목록 설정">•••</button></div></header>
<div class="view-meta"><span id="task-count"></span><button id="select-all">여러 항목 선택</button></div><div id="bulk" hidden></div><section id="tasks" aria-label="할 일"></section><div class="add-wrap"><form id="add-task"><span>＋</span><input id="new-title" maxlength="1000" autocomplete="off" placeholder="할 일 추가" aria-label="새 할 일"><button type="submit">추가 ↵</button></form><small id="add-hint">Enter를 눌러 빠르게 추가하세요</small></div></main>
<aside id="detail" class="detail" aria-label="작업 상세" hidden></aside></div>
<div id="toast" role="status" hidden></div><dialog id="dialog"><div id="dialog-body"></div></dialog><input type="file" id="import-file" accept=".json,application/json" hidden>
</body></html>

<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#526bc2"><title>나의 업무 · To Do</title><link rel="stylesheet" href="styles.css?v=1.3"><script defer src="core.js?v=1.3"></script><script defer src="app.js?v=1.3"></script><script defer src="cloud.js?v=1.3"></script></head><body>
<section id="auth-screen" class="auth-screen" aria-label="계정 로그인">
<div class="auth-card">
<div class="auth-brand"><div class="avatar" aria-hidden="true">✓</div><span>나의 업무 <small>v1.3</small></span></div>
<h1 id="auth-title">로그인</h1><p id="auth-description">내 계정의 할 일을 이어서 관리하세요.</p>
<div id="auth-tabs" class="auth-tabs" role="group" aria-label="로그인 또는 회원가입">
<button type="button" data-auth-mode="login" aria-pressed="true">로그인</button><button type="button" data-auth-mode="signup" aria-pressed="false">회원가입</button>
</div>
<p id="auth-error" role="alert" hidden></p><p id="auth-message" class="auth-message" role="status" aria-live="polite" hidden></p>
<form id="login-form">
<label>이메일<input id="login-email" type="email" autocomplete="username" required maxlength="254"></label>
<label>비밀번호<input id="login-password" type="password" autocomplete="current-password" required></label>
<button class="primary" type="submit">로그인</button>
<div class="auth-links"><button type="button" data-auth-mode="recover">비밀번호 찾기</button><button type="button" data-auth-mode="resend">인증 메일 다시 받기</button></div>
</form>
<form id="signup-form" hidden>
<label>이메일<input id="signup-email" type="email" autocomplete="username" required maxlength="254"></label>
<label>비밀번호<input id="signup-password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required aria-describedby="signup-password-hint"></label>
<small id="signup-password-hint">8자 이상 입력하세요.</small>
<label>비밀번호 확인<input id="signup-confirm" type="password" autocomplete="new-password" minlength="8" maxlength="128" required></label>
<button class="primary" type="submit">회원가입</button><p class="auth-footnote">가입 후 받은 메일에서 이메일 인증을 완료하세요.</p>
</form>
<form id="recover-form" hidden>
<label>가입한 이메일<input id="recover-email" type="email" autocomplete="email" required maxlength="254"></label>
<button class="primary" type="submit">재설정 메일 받기</button><button type="button" data-auth-mode="login">로그인으로 돌아가기</button>
</form>
<form id="resend-form" hidden>
<label>가입한 이메일<input id="resend-email" type="email" autocomplete="email" required maxlength="254"></label>
<button class="primary" type="submit">인증 메일 다시 받기</button><button type="button" data-auth-mode="login">로그인으로 돌아가기</button>
</form>
<form id="reset-form" hidden>
<p id="reset-email" class="auth-footnote"></p>
<label>새 비밀번호<input id="reset-password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required aria-describedby="reset-password-hint"></label>
<small id="reset-password-hint">8자 이상 입력하세요.</small>
<label>새 비밀번호 확인<input id="reset-confirm" type="password" autocomplete="new-password" minlength="8" maxlength="128" required></label>
<button class="primary" type="submit">새 비밀번호 저장</button><button type="button" id="cancel-reset">취소하고 로그인으로 돌아가기</button>
</form>
<p class="auth-privacy">카테고리와 할 일은 계정별로 따로 저장됩니다.</p>
</div></section>
<section id="sync-error" class="auth-screen" hidden><div class="auth-card"><h2>저장 확인이 필요합니다</h2><p id="sync-message" role="alert"></p><button id="sync-backup">현재 내용 백업</button><button id="sync-retry">다시 시도</button><button id="sync-reload">서버 내용 다시 불러오기</button></div></section>
<div class="app" hidden>
<aside class="sidebar" id="sidebar"><div class="identity"><div class="avatar">✓</div><div><strong>나의 업무</strong><small id="account-email">하나씩, 차근차근</small></div><button class="icon mobile" id="hide-nav" aria-label="메뉴 닫기">×</button></div>
<label class="search"><span>⌕</span><input id="search" placeholder="검색" aria-label="할 일 검색"><kbd>Ctrl K</kbd></label><nav id="nav" aria-label="작업 목록"></nav><div class="new-list"><button id="add-list">＋ 새 목록</button><button class="icon" id="add-group" aria-label="새 그룹" title="새 그룹">▧</button></div>
<footer><button id="logout">로그아웃</button><button id="settings">⚙ 설정 및 백업</button><div class="storage"><span class="dot"></span><span id="save-status" role="status">로그인 후 서버에서 불러옵니다</span></div></footer></aside>
<main id="main" class="main blue"><header><div><button id="show-nav" class="icon mobile" aria-label="메뉴 열기">☰</button><h1 class="view-heading"><button id="view-title" type="button" disabled></button></h1><p id="date-label"></p></div><div class="toolbar"><button id="suggest" title="오늘 할 일 추천">☼ 추천</button><label class="sort-label"><span>정렬</span><select id="sort" aria-label="작업 정렬"><option value="manual">사용자 순서</option><option value="due">기한순</option><option value="important">중요도순</option><option value="created">최신순</option><option value="title">이름순</option></select></label><button id="list-settings" class="icon" aria-label="카테고리 메뉴" title="카테고리 메뉴">•••</button></div></header>
<div class="view-meta"><span id="task-count"></span><button id="select-all">여러 항목 선택</button></div><div id="bulk" hidden></div><section id="tasks" aria-label="할 일"></section><div class="add-wrap"><form id="add-task"><span>＋</span><input id="new-title" maxlength="1000" autocomplete="off" placeholder="할 일 추가" aria-label="새 할 일"><button type="submit">추가 ↵</button></form><small id="add-hint">Enter를 눌러 빠르게 추가하세요</small></div></main>
<aside id="detail" class="detail" aria-label="작업 상세" hidden></aside></div>
<div id="toast" role="status" hidden></div><dialog id="dialog"><div id="dialog-body"></div></dialog><input type="file" id="import-file" accept=".json,application/json" hidden>
</body></html>
